- name: Configure capstone DNS server
  hosts: dns
  become: true

  tasks:
    - name: Deploy dnsmasq configuration
      template:
        src: ~/capstone/templates/dnsmasq.conf.j2
        dest: /etc/dnsmasq.d/capstone.conf
      notify: Restart dnsmasq
    - name: Validate dnsmasq configuration
      command: dnsmasq --test
      changed_when: false

  handlers:
    - name: Restart dnsmasq
      service:
        name: dnsmasq
        state: restarted
